<!DOCTYPE html>
<html>
<head>
    <title>Service Management Login</title>
</head>
<body>

    <h1>ROBO DIGITAL COMPUTERS</h1>

    <h2>Service Management</h2>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</body>
</html>
