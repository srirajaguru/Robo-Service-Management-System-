<!doctype html><html><head><title>Customers</title></head><body><h1>Customers</h1><nav><a href="{% url 'staff_dashboard' %}">Dashboard</a> | <a href="{% url 'customer_create' %}">Add customer</a></nav><form><input name="q" value="{{ query }}" placeholder="Name, phone or customer ID"><button>Search</button></form><table border="1"><tr><th>ID</th><th>Name</th><th>Phone</th><th></th></tr>{% for customer in customers %}<tr><td>{{ customer.customer }}</td><td>{{ customer.name }}</td><td>{{ customer.phone_number }}</td><td><a href="{% url 'customer_detail' customer.pk %}">View</a></td></tr>{% empty %}<tr><td colspan="4">No customers found.</td></tr>{% endfor %}</table></body></html>
