<!doctype html><html><head><title>{{ customer.name }}</title></head><body><h1>{{ customer.name }}</h1><p>{{ customer.customer }} | {{ customer.phone_number }} | {{ customer.email }}</p><p>{{ customer.address }}</p><h2>Service history</h2>{% for service in services %}<p><a href="{% url 'service_detail' service.pk %}">{{ service }}</a> - {{ service.status }} - {{ service.price }}</p>{% empty %}<p>No services recorded.</p>{% endfor %}<a href="{% url 'customer_list' %}">Back to customers</a></body></html>
